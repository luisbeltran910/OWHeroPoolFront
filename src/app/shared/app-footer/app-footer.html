<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <app-logo [size]="24" />
      <span>Hero Pool</span>
    </div>

    <div class="site-footer__notes">
      <p class="site-footer__note site-footer__note--credit">
        Made by Luxar — a community project, built for the community.
      </p>
      <p class="site-footer__note">
        Unofficial fan project, not affiliated with or endorsed by Blizzard Entertainment. Hero
        stats sourced from Blizzard's official Hero Statistics page.
      </p>
    </div>

    <span class="site-footer__year">© {{ year }}</span>
  </div>
</footer>
